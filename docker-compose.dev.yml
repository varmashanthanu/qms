version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
        - .env-dev
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build:
      dockerfile: Dockerfile.dev
    command: daphne -b 0.0.0.0 -p 8000 qms.asgi:application
    volumes:
      - .:/app
    environment:
      ENVIRONMENT: development
    env_file:
      - .env-dev
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

volumes:
  postgres_data:
